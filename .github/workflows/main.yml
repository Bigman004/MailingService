name: build with maven

on:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'zulu'
          cache: maven
      - name: build application
        run: >
          mvn clean install
          -DMAIL_DATABASE_URL=${{secrets.MAIL_DATABASE_URL}}
          -DMAIL_DATABASE_PASSWORD=${{secrets.MAIL_DATABASE_PASSWORD}}
          -DMAIL_DATABASE_USERNAME=${{secrets.MAIL_DATABASE_USERNAME}}
          -DSHARED_KEY=${{secrets.SHARED_KEY}}
          -DMAIL_PASSWORD=${{secrets.MAIL_PASSWORD}}
          -DMAIL_USERNAME=${{secrets.MAIL_USERNAME}}
      - name: build image
        run: docker build -t mailing-service .
      - name: tag image
        run: docker tag mailing-service bigman004/mailing-service:latest
      - name: login
        run: docker login -u bigman004 -p ${{secrets.DOCKER_SECRET}}
      - name: push image
        run: docker push bigman004/payment-service:latest