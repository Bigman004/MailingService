<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>

    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Email</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body
        { background: #f0ede8;
            font-family: 'DM Sans', sans-serif; padding: 40px 16px; }
        .wrap { max-width: 580px; margin: 0 auto; }
        .card { background: #fff; border-radius: 6px; overflow: hidden; box-shadow: 0 2px 20px rgba(0,0,0,0.07); }
        .header { background: #0c1624; padding: 28px 40px; display: flex; align-items: center; justify-content: space-between; }
        .logo { font-family: 'DM Serif Display', serif; font-size: 22px; color: #fff; }
        .logo span { color: #5DCAA5; }
        .header-date { font-size: 11px; color: #4a6070; }
        .accent { height: 3px; background: linear-gradient(90deg, #5DCAA5, #185FA5); }
        .body { padding: 44px 40px 36px; }
        .greeting { font-size: 15px; color: #555; font-weight: 300; margin-bottom: 8px; }
        .body h1 { font-family: 'DM Serif Display', serif; font-size: 28px; color: #0c1624; margin-bottom: 24px; line-height: 1.2; }
        .message-block {
            padding: 20px 22px;
            background: #f7f5f1;
            border-left: 3px solid #5DCAA5;
            border-radius: 0 4px 4px 0;
            margin-bottom: 28px; }
        .msg-label { font-size: 10px; font-weight: 500; letter-spacing: 1px; text-transform: uppercase; color: #0F6E56; margin-bottom: 8px; }
        .message-block p { font-size: 15px; line-height: 1.75; color: #444; font-style: italic; font-weight: 300; }
        .cta { display: inline-block; background: #0c1624; color: #fff; font-size: 13px; font-weight: 500; padding: 12px 26px; border-radius: 3px; text-decoration: none; }
        .footer { background: #0c1624; padding: 28px 40px; text-align: center; }
        .footer-logo {
            font-family: 'DM Serif Display', serif;
            font-size: 16px;
            color: #fff;
            margin-bottom: 14px; }
        .footer-logo span
        { color: #5DCAA5; }
        .footer-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }
        .footer-links a {
            font-size: 11px;
            color: #4a6070;
            text-decoration: none;
        }
        .footer-copy {
            font-size: 10.5px;
            color: #334455;
            line-height: 1.7; }
    </style>
</head>
<body>
<div class="wrap">
    <div class="card">

        <div class="header">
            <div class="logo">A spark tech.<span>.</span></div>
            <div class="header-date" th:text="${timestamp}"></div>
        </div>
        <div class="accent"></div>

        <div class="body">
            <p class="greeting">Hello <span th:text ="${to}"></span>,</p>
            <h1>A quick note<br>from our team.</h1>

            <!-- ✏️ Replace this placeholder with your message -->
            <div class="message-block">
                <div class="msg-label">Your message</div>
                <p th:text="${content}"></p>
            </div>
            <!-- End message block -->

            <a href="#" class="cta">Get started →</a>
        </div>

        <div class="footer">
            <div class="footer-logo">Nova<span>.</span></div>
            <p class="footer-copy">
                A .S Inc. · 340 Alagemo Ikorodu 94104<br>
                © 2026 A. S Inc. All rights reserved.
            </p>
        </div>

    </div>
</div>
</body>

</html>
